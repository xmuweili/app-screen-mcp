<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">app-screen-mcp banner</title>
  <desc id="desc">Minimal banner for app-screen-mcp.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1721"/>
      <stop offset="1" stop-color="#122736"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#9FD3E0" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="560" fill="url(#bg)"/>
  <rect width="1600" height="560" fill="url(#grid)"/>

  <rect x="72" y="88" width="228" height="28" rx="14" fill="#1F3A4A" stroke="#4FD1E0" stroke-opacity="0.4"/>
  <text x="186" y="107" text-anchor="middle" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" letter-spacing="1.2" fill="#A7F3D0">MODEL CONTEXT PROTOCOL</text>

  <text x="72" y="210" font-family="Avenir Next, Segoe UI, Helvetica Neue, sans-serif" font-size="82" font-weight="800" fill="#E6FAFF">app-screen-mcp</text>
  <text x="72" y="258" font-family="Avenir Next, Segoe UI, Helvetica Neue, sans-serif" font-size="31" font-weight="500" fill="#BFE8F2">AI control for iOS Simulator, built on accessibility.</text>

  <g transform="translate(72,304)">
    <rect x="0" y="0" width="182" height="40" rx="20" fill="#173949" stroke="#40CBE2" stroke-opacity="0.5"/>
    <text x="91" y="26" text-anchor="middle" font-family="Avenir Next, Segoe UI, Helvetica Neue, sans-serif" font-size="16" font-weight="600" fill="#CFFAFE">UI Tree + Vision</text>

    <rect x="198" y="0" width="160" height="40" rx="20" fill="#173949" stroke="#40CBE2" stroke-opacity="0.5"/>
    <text x="278" y="26" text-anchor="middle" font-family="Avenir Next, Segoe UI, Helvetica Neue, sans-serif" font-size="16" font-weight="600" fill="#CFFAFE">Tap • Swipe</text>

    <rect x="374" y="0" width="144" height="40" rx="20" fill="#173949" stroke="#40CBE2" stroke-opacity="0.5"/>
    <text x="446" y="26" text-anchor="middle" font-family="Avenir Next, Segoe UI, Helvetica Neue, sans-serif" font-size="16" font-weight="600" fill="#CFFAFE">Type Text</text>
  </g>

  <g transform="translate(980,84)">
    <rect x="0" y="0" width="520" height="392" rx="20" fill="#0F2230" stroke="#335C72"/>
    <rect x="0" y="0" width="520" height="4" fill="url(#accent)"/>

    <text x="24" y="42" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" fill="#A7F3D0">get_screen_summary()</text>
    <line x1="24" y1="58" x2="496" y2="58" stroke="#2D4D60"/>

    <text x="24" y="96" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" fill="#D8F5FF">{</text>
    <text x="42" y="126" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" fill="#D8F5FF">"element_count": 27,</text>
    <text x="42" y="154" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" fill="#D8F5FF">"actions": ["tap_text", "type_text"],</text>
    <text x="42" y="182" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" fill="#D8F5FF">"screenshot": "&lt;base64&gt;"</text>
    <text x="24" y="210" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" fill="#D8F5FF">}</text>

    <rect x="24" y="250" width="472" height="112" rx="12" fill="#102C3D" stroke="#2D4D60"/>
    <line x1="52" y1="306" x2="206" y2="306" stroke="#40CBE2" stroke-width="2"/>
    <line x1="216" y1="306" x2="370" y2="306" stroke="#34D399" stroke-width="2"/>
    <line x1="380" y1="306" x2="468" y2="306" stroke="#40CBE2" stroke-width="2"/>
    <text x="246" y="292" text-anchor="middle" font-family="Avenir Next, Segoe UI, Helvetica Neue, sans-serif" font-size="14" font-weight="600" fill="#CFFAFE">AI Agent → app-screen-mcp → iOS Simulator</text>
    <text x="246" y="332" text-anchor="middle" font-family="Avenir Next, Segoe UI, Helvetica Neue, sans-serif" font-size="13" fill="#A7D7E5">Deterministic automation from live screen context</text>
  </g>

  <text x="72" y="520" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" fill="#8EBFCE">github.com/xmuweili/app-screen-mcp</text>
</svg>
