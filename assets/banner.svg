<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">app-screen-mcp banner</title>
  <desc id="desc">Minimal and neat banner for app-screen-mcp.</desc>

  <defs>
    <linearGradient id="lineAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0EA5A5"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="560" fill="#F7F8FA"/>

  <circle cx="1420" cy="-60" r="220" fill="#0F172A" fill-opacity="0.04"/>
  <circle cx="160" cy="600" r="220" fill="#0F172A" fill-opacity="0.03"/>

  <rect x="96" y="92" width="232" height="34" rx="17" fill="#E9EEF5"/>
  <text x="212" y="115" text-anchor="middle" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" letter-spacing="1.1" fill="#334155">MCP FOR IOS SIMULATOR</text>

  <rect x="96" y="164" width="66" height="66" rx="16" fill="#FFFFFF" stroke="#D8DEE8"/>
  <rect x="114" y="182" width="30" height="30" rx="8" fill="#0F172A"/>
  <circle cx="129" cy="197" r="3.5" fill="#FFFFFF"/>
  <circle cx="146" cy="197" r="3.5" fill="#FFFFFF"/>
  <rect x="124" y="208" width="27" height="2.5" rx="1.25" fill="#FFFFFF"/>

  <text x="184" y="206" font-family="Avenir Next, Inter, Segoe UI, sans-serif" font-size="76" font-weight="750" fill="#0F172A">app-screen-mcp</text>
  <text x="98" y="258" font-family="Avenir Next, Inter, Segoe UI, sans-serif" font-size="30" font-weight="500" fill="#475569">Grounded automation for iOS Simulator agents.</text>

  <line x1="96" y1="292" x2="760" y2="292" stroke="#CBD5E1"/>

  <g transform="translate(96,326)">
    <text x="0" y="0" font-family="Avenir Next, Inter, Segoe UI, sans-serif" font-size="22" font-weight="600" fill="#0F172A">Observe</text>
    <text x="0" y="34" font-family="Avenir Next, Inter, Segoe UI, sans-serif" font-size="20" fill="#475569">UI tree + screenshot</text>

    <text x="260" y="0" font-family="Avenir Next, Inter, Segoe UI, sans-serif" font-size="22" font-weight="600" fill="#0F172A">Reason</text>
    <text x="260" y="34" font-family="Avenir Next, Inter, Segoe UI, sans-serif" font-size="20" fill="#475569">pick next safe action</text>

    <text x="528" y="0" font-family="Avenir Next, Inter, Segoe UI, sans-serif" font-size="22" font-weight="600" fill="#0F172A">Act</text>
    <text x="528" y="34" font-family="Avenir Next, Inter, Segoe UI, sans-serif" font-size="20" fill="#475569">tap, type, swipe, verify</text>
  </g>

  <line x1="184" y1="394" x2="340" y2="394" stroke="url(#lineAccent)" stroke-width="3" stroke-linecap="round"/>
  <line x1="452" y1="394" x2="608" y2="394" stroke="url(#lineAccent)" stroke-width="3" stroke-linecap="round"/>

  <g transform="translate(938,86)">
    <rect x="0" y="0" width="566" height="388" rx="22" fill="#FFFFFF" stroke="#D8DEE8"/>
    <rect x="0" y="0" width="566" height="6" rx="3" fill="url(#lineAccent)"/>

    <text x="30" y="48" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16" fill="#0F172A">get_screen_summary()</text>
    <line x1="30" y1="64" x2="536" y2="64" stroke="#E2E8F0"/>

    <text x="30" y="102" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" fill="#334155">{ "elements": 42, "image": "&lt;base64&gt;" }</text>
    <text x="30" y="132" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" fill="#334155">{ "next": "tap_text(\"Sign In\")" }</text>

    <g transform="translate(30,184)">
      <rect x="0" y="0" width="506" height="164" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="24" y="40" font-family="Avenir Next, Inter, Segoe UI, sans-serif" font-size="22" font-weight="600" fill="#0F172A">Agent loop</text>
      <text x="24" y="76" font-family="Avenir Next, Inter, Segoe UI, sans-serif" font-size="18" fill="#475569">1. Read current screen state</text>
      <text x="24" y="106" font-family="Avenir Next, Inter, Segoe UI, sans-serif" font-size="18" fill="#475569">2. Execute one deterministic interaction</text>
      <text x="24" y="136" font-family="Avenir Next, Inter, Segoe UI, sans-serif" font-size="18" fill="#475569">3. Re-check and continue</text>
    </g>
  </g>

  <text x="96" y="520" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" fill="#64748B">github.com/xmuweili/app-screen-mcp</text>
</svg>
