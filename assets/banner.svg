<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a"/>
      <stop offset="50%" style="stop-color:#0d1529"/>
      <stop offset="100%" style="stop-color:#0a0e1a"/>
    </linearGradient>
    <!-- Purple glow gradient -->
    <radialGradient id="glow1" cx="30%" cy="50%" r="40%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0"/>
    </radialGradient>
    <!-- Cyan glow gradient -->
    <radialGradient id="glow2" cx="75%" cy="45%" r="35%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0"/>
    </radialGradient>
    <!-- Node glow filter -->
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Subtle glow for lines -->
    <filter id="lineGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Text glow -->
    <filter id="textGlow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Clip for phone screen -->
    <clipPath id="screenClip">
      <rect x="862" y="62" width="170" height="276" rx="4"/>
    </clipPath>
    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e2d4a" stroke-width="0.5" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <rect width="1280" height="400" fill="url(#glow1)"/>
  <rect width="1280" height="400" fill="url(#glow2)"/>

  <!-- Subtle top + bottom border lines -->
  <line x1="0" y1="0" x2="1280" y2="0" stroke="#7c3aed" stroke-width="2" opacity="0.6"/>
  <line x1="0" y1="399" x2="1280" y2="399" stroke="#06b6d4" stroke-width="2" opacity="0.4"/>

  <!-- ─── iPhone Device ─── -->
  <!-- Phone body -->
  <rect x="855" y="38" width="184" height="324" rx="26" fill="#111827" stroke="#374151" stroke-width="2"/>
  <!-- Dynamic Island -->
  <rect x="910" y="50" width="74" height="16" rx="8" fill="#000"/>
  <!-- Screen area -->
  <rect x="862" y="62" width="170" height="276" rx="4" fill="#0f172a"/>

  <!-- Fake app content on screen -->
  <!-- Nav bar -->
  <rect x="862" y="62" width="170" height="32" rx="0" fill="#1e293b"/>
  <rect x="874" y="73" width="60" height="10" rx="3" fill="#475569"/>
  <rect x="970" y="73" width="18" height="10" rx="3" fill="#7c3aed" opacity="0.9"/>

  <!-- Content blocks (fake UI) -->
  <rect x="874" y="106" width="64" height="48" rx="6" fill="#1e3a5f" opacity="0.8"/>
  <rect x="944" y="106" width="64" height="48" rx="6" fill="#1e3a5f" opacity="0.8"/>
  <rect x="874" y="162" width="134" height="14" rx="3" fill="#334155"/>
  <rect x="874" y="182" width="90" height="14" rx="3" fill="#334155"/>
  <rect x="874" y="210" width="134" height="32" rx="6" fill="#7c3aed" opacity="0.6"/>
  <rect x="874" y="250" width="60" height="60" rx="6" fill="#1e3a5f" opacity="0.7"/>
  <rect x="940" y="250" width="60" height="60" rx="6" fill="#1e3a5f" opacity="0.7"/>

  <!-- Clip screen content -->
  <rect x="862" y="62" width="170" height="276" rx="4" fill="none" clip-path="url(#screenClip)"/>

  <!-- Bounding box overlays on screen elements (accessibility) -->
  <rect x="874" y="106" width="64" height="48" rx="2" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.9"/>
  <rect x="944" y="106" width="64" height="48" rx="2" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.9"/>
  <rect x="874" y="210" width="134" height="32" rx="2" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.9"/>
  <rect x="874" y="250" width="60" height="60" rx="2" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.7"/>
  <rect x="940" y="250" width="60" height="60" rx="2" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.7"/>

  <!-- Phone home indicator -->
  <rect x="912" y="354" width="70" height="4" rx="2" fill="#374151"/>

  <!-- ─── Accessibility Tree Nodes (right side of phone) ─── -->
  <!-- Connector lines from phone to tree -->
  <g filter="url(#lineGlow)" opacity="0.6">
    <line x1="1039" y1="130" x2="1085" y2="115" stroke="#06b6d4" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="1039" y1="226" x2="1085" y2="200" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="1039" y1="280" x2="1085" y2="280" stroke="#06b6d4" stroke-width="1" stroke-dasharray="4,3"/>
  </g>

  <!-- Tree nodes -->
  <!-- Root -->
  <circle cx="1100" cy="115" r="7" fill="#06b6d4" opacity="0.95" filter="url(#nodeGlow)"/>
  <line x1="1107" y1="115" x2="1127" y2="150" stroke="#334155" stroke-width="1.2"/>
  <line x1="1107" y1="115" x2="1127" y2="185" stroke="#334155" stroke-width="1.2"/>
  <!-- Child nodes -->
  <circle cx="1135" cy="150" r="5.5" fill="#a78bfa" opacity="0.9" filter="url(#nodeGlow)"/>
  <circle cx="1135" cy="185" r="5.5" fill="#a78bfa" opacity="0.9" filter="url(#nodeGlow)"/>
  <line x1="1141" y1="150" x2="1158" y2="168" stroke="#334155" stroke-width="1"/>
  <line x1="1141" y1="185" x2="1158" y2="200" stroke="#334155" stroke-width="1"/>
  <line x1="1141" y1="185" x2="1158" y2="220" stroke="#334155" stroke-width="1"/>
  <!-- Leaf nodes -->
  <circle cx="1165" cy="168" r="4" fill="#34d399" opacity="0.85" filter="url(#nodeGlow)"/>
  <circle cx="1165" cy="200" r="4" fill="#34d399" opacity="0.85" filter="url(#nodeGlow)"/>
  <circle cx="1165" cy="220" r="4" fill="#34d399" opacity="0.85" filter="url(#nodeGlow)"/>

  <!-- Purple node (button) -->
  <circle cx="1100" cy="200" r="7" fill="#a78bfa" opacity="0.95" filter="url(#nodeGlow)"/>
  <!-- Cyan node (scroll area) -->
  <circle cx="1100" cy="280" r="7" fill="#06b6d4" opacity="0.95" filter="url(#nodeGlow)"/>

  <!-- Node labels (tiny) -->
  <text x="1115" y="113" font-family="monospace" font-size="9" fill="#64748b">Application</text>
  <text x="1148" y="148" font-family="monospace" font-size="8" fill="#64748b">Button</text>
  <text x="1148" y="183" font-family="monospace" font-size="8" fill="#64748b">ScrollArea</text>
  <text x="1175" y="166" font-family="monospace" font-size="8" fill="#64748b">Text</text>
  <text x="1175" y="198" font-family="monospace" font-size="8" fill="#64748b">Text</text>
  <text x="1175" y="218" font-family="monospace" font-size="8" fill="#64748b">Image</text>
  <text x="1115" y="198" font-family="monospace" font-size="8" fill="#64748b">Heading</text>
  <text x="1115" y="278" font-family="monospace" font-size="8" fill="#64748b">TextField</text>

  <!-- ─── Main Title + Text (left side) ─── -->
  <!-- Eyebrow label -->
  <rect x="60" y="90" width="190" height="24" rx="12" fill="#7c3aed" opacity="0.15" stroke="#7c3aed" stroke-width="1" opacity="0.4"/>
  <text x="155" y="107" font-family="'SF Mono', 'Fira Code', monospace" font-size="12" fill="#a78bfa" text-anchor="middle" letter-spacing="2">MODEL CONTEXT PROTOCOL</text>

  <!-- Main title -->
  <text x="60" y="175" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="800" fill="white" filter="url(#textGlow)" opacity="0.15">app-screen-mcp</text>
  <text x="60" y="175" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="800" fill="white">
    <tspan fill="white">app-screen-</tspan><tspan fill="#06b6d4">mcp</tspan>
  </text>

  <!-- Tagline -->
  <text x="62" y="215" font-family="'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#94a3b8" letter-spacing="0.3">
    Give AI eyes and hands on your iOS Simulator
  </text>

  <!-- Feature pills -->
  <g transform="translate(62, 248)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="130" height="28" rx="14" fill="#06b6d4" opacity="0.12" stroke="#06b6d4" stroke-width="1" opacity="0.5"/>
    <circle cx="18" cy="14" r="4" fill="#06b6d4"/>
    <text x="30" y="19" font-family="'SF Pro Text', Arial, sans-serif" font-size="12" fill="#67e8f9">Accessibility Tree</text>
    <!-- Pill 2 -->
    <rect x="144" y="0" width="130" height="28" rx="14" fill="#a78bfa" opacity="0.12" stroke="#a78bfa" stroke-width="1" opacity="0.5"/>
    <circle cx="162" cy="14" r="4" fill="#a78bfa"/>
    <text x="174" y="19" font-family="'SF Pro Text', Arial, sans-serif" font-size="12" fill="#c4b5fd">Tap · Swipe · Type</text>
    <!-- Pill 3 -->
    <rect x="288" y="0" width="130" height="28" rx="14" fill="#34d399" opacity="0.12" stroke="#34d399" stroke-width="1" opacity="0.5"/>
    <circle cx="306" cy="14" r="4" fill="#34d399"/>
    <text x="318" y="19" font-family="'SF Pro Text', Arial, sans-serif" font-size="12" fill="#6ee7b7">Screenshot + Vision</text>
    <!-- Pill 4 -->
    <rect x="432" y="0" width="118" height="28" rx="14" fill="#fb923c" opacity="0.12" stroke="#fb923c" stroke-width="1" opacity="0.5"/>
    <circle cx="450" cy="14" r="4" fill="#fb923c"/>
    <text x="462" y="19" font-family="'SF Pro Text', Arial, sans-serif" font-size="12" fill="#fdba74">12 MCP Tools</text>
  </g>

  <!-- Bottom: "by xmuweili" subtle credit -->
  <text x="62" y="360" font-family="'SF Mono', monospace" font-size="11" fill="#334155">github.com/xmuweili/app-screen-mcp</text>

  <!-- Decorative corner dot cluster top-right -->
  <g opacity="0.3">
    <circle cx="1220" cy="30" r="2" fill="#7c3aed"/>
    <circle cx="1235" cy="30" r="2" fill="#7c3aed"/>
    <circle cx="1250" cy="30" r="2" fill="#7c3aed"/>
    <circle cx="1220" cy="45" r="2" fill="#7c3aed"/>
    <circle cx="1235" cy="45" r="2" fill="#7c3aed"/>
    <circle cx="1250" cy="45" r="2" fill="#7c3aed"/>
    <circle cx="1220" cy="60" r="2" fill="#7c3aed"/>
    <circle cx="1235" cy="60" r="2" fill="#7c3aed"/>
    <circle cx="1250" cy="60" r="2" fill="#7c3aed"/>
  </g>
  <!-- Decorative corner dot cluster bottom-left -->
  <g opacity="0.2">
    <circle cx="20" cy="340" r="2" fill="#06b6d4"/>
    <circle cx="35" cy="340" r="2" fill="#06b6d4"/>
    <circle cx="20" cy="355" r="2" fill="#06b6d4"/>
    <circle cx="35" cy="355" r="2" fill="#06b6d4"/>
    <circle cx="20" cy="370" r="2" fill="#06b6d4"/>
    <circle cx="35" cy="370" r="2" fill="#06b6d4"/>
  </g>
</svg>
